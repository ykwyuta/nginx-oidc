# E2E テスト用の NGINX 設定。
#
# 起動例:
#   nginx -c <repo>/test/nginx.conf -p <prefix>
#
# load_module のパスはテストランナー (test/run-e2e.sh) が実行時に差し替える。

worker_processes  1;
error_log  logs/error.log info;

load_module /app/objs/ngx_http_oidc_module.so;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log    logs/access.log;

    # 全ワーカーで同一の HMAC 鍵を使う。本番では openssl rand -hex 32 の値を設定する。
    oidc_cookie_secret "test-secret-key-1234567890";

    # セッションの保存先。run-e2e.sh がこの行を書き換えて
    # 共有メモリ / Cookie のみ / Redis の 3 通りでテストする（書式を変えないこと）。
    oidc_session_store 4m;

    # 変数を使った proxy_pass は upstream を実行時に解決するため、IdP のエンドポイントが
    # ホスト名の場合は resolver が必須（未設定だと "no resolver defined to resolve ..."
    # で失敗する）。本テストは IdP を IP リテラルで参照するため不要。
    # resolver 127.0.0.53 ipv6=off valid=300s;

    # 名前付きプロバイダ（NGINX Plus 互換のブロック構文）
    oidc_provider test-idp {
        issuer        "http://127.0.0.1:3000";
        client_id     "test-client-id";
        client_secret "test-client-secret";
        redirect_uri  "http://localhost:8080/preset/callback";
        scope         "openid profile email";
        userinfo      on;
    }

    server {
        listen       8080;
        server_name  localhost;

        # ---- IdP と通信する内部ロケーション ----

        location = /_oidc_discovery {
            internal;
            proxy_pass            $oidc_discovery_url;
            proxy_ssl_verify      off;
            proxy_ssl_server_name on;
        }

        location = /_oidc_token {
            internal;
            proxy_pass       $oidc_token_url;
            proxy_method     POST;
            proxy_set_header Content-Type  "application/x-www-form-urlencoded";
            proxy_set_header Authorization $oidc_token_basic;
            proxy_set_header DPoP          $oidc_dpop_proof;
            proxy_set_body   $oidc_token_body;

            # mTLS クライアント認証用（HTTP の IdP には影響しない）
            proxy_ssl_certificate     client-cert.pem;
            proxy_ssl_certificate_key client-key-tls.pem;
            proxy_ssl_verify          off;
            proxy_ssl_server_name     on;
        }

        # oidc_par on; のときに使う
        location = /_oidc_par {
            internal;
            proxy_pass       $oidc_par_url;
            proxy_method     POST;
            proxy_set_header Content-Type  "application/x-www-form-urlencoded";
            proxy_set_header Authorization $oidc_token_basic;
            proxy_set_body   $oidc_par_body;

            proxy_ssl_certificate     client-cert.pem;
            proxy_ssl_certificate_key client-key-tls.pem;
            proxy_ssl_verify          off;
            proxy_ssl_server_name     on;
        }

        location = /_oidc_jwks {
            internal;
            proxy_pass            $oidc_jwks_url;
            proxy_ssl_verify      off;
            proxy_ssl_server_name on;
        }

        location = /_oidc_userinfo {
            internal;
            proxy_pass       $oidc_userinfo_url;
            proxy_set_header Authorization $oidc_userinfo_bearer;
            proxy_set_header DPoP          $oidc_dpop_proof;
            proxy_ssl_verify      off;
            proxy_ssl_server_name on;
        }

        # oidc_session_store redis; のときに使われる
        location = /_oidc_redis {
            internal;
            oidc_redis_pass 127.0.0.1:6399;
        }

        location = /_oidc_introspect {
            internal;
            proxy_pass       $oidc_introspect_url;
            proxy_method     POST;
            proxy_set_header Content-Type  "application/x-www-form-urlencoded";
            proxy_set_header Authorization $oidc_token_basic;
            proxy_set_body   $oidc_introspect_body;
        }

        # ---- 保護対象 ----

        # ログアウト・リフレッシュ・イントロスペクション・client_secret_post の検証用
        location /session/ {
            auth_oidc                     on;
            oidc_provider                 "http://127.0.0.1:3000";
            oidc_client_id                "test-client-id";
            oidc_client_secret            "test-client-secret";
            # コールバックは同じロケーション配下に置く（トークン交換時に
            # このロケーションの設定が使われるようにするため）
            oidc_redirect_uri             "http://localhost:8080/session/callback";
            oidc_scope                    "openid profile email";
            oidc_logout_uri               "http://localhost:8080/session/logout";
            oidc_backchannel_logout_uri   "http://localhost:8080/session/backchannel-logout";
            oidc_frontchannel_logout_uri  "http://localhost:8080/session/frontchannel-logout";
            oidc_post_logout_redirect_uri "http://localhost:8080/bye";
            oidc_client_auth              post;
            oidc_refresh_token            on;
            oidc_introspection            on;
            oidc_introspection_interval   1s;
            oidc_auth_request_args        "prompt=consent&login_hint=testuser@example.com";

            proxy_pass http://127.0.0.1:8081;
            proxy_set_header X-User-Sub    $oidc_claim_sub;
            proxy_set_header X-User-Email  $oidc_claim_email;
            proxy_set_header X-User-Name   $oidc_claim_name;
            proxy_set_header X-User-Groups $oidc_claim_groups;
            proxy_set_header X-Tenant-Id   $oidc_claim_tenant_id;
            proxy_set_header X-Token-Auth  $oidc_claim_token_auth;
            proxy_set_header X-Id-Token    $oidc_id_token;
            proxy_set_header X-Oidc-Sid    $oidc_sid;
        }

        # private_key_jwt によるクライアント認証
        location /pkjwt/ {
            auth_oidc           on;
            oidc_provider       "http://127.0.0.1:3000";
            oidc_client_id      "test-client-id";
            oidc_redirect_uri   "http://localhost:8080/pkjwt/callback";
            oidc_client_auth    private_key_jwt;
            oidc_client_jwt_key client-key.pem;
            oidc_client_jwt_kid "client-key-1";

            proxy_pass http://127.0.0.1:8081;
            proxy_set_header X-User-Sub    $oidc_claim_sub;
            proxy_set_header X-User-Email  $oidc_claim_email;
            proxy_set_header X-User-Name   $oidc_claim_name;
            proxy_set_header X-User-Groups $oidc_claim_groups;
            proxy_set_header X-Tenant-Id   $oidc_claim_tenant_id;
            proxy_set_header X-Token-Auth  $oidc_claim_token_auth;
            proxy_set_header X-Id-Token    $oidc_id_token;
            proxy_set_header X-Oidc-Sid    $oidc_sid;
        }

        # client_secret_jwt によるクライアント認証
        location /csjwt/ {
            auth_oidc          on;
            oidc_provider      "http://127.0.0.1:3000";
            oidc_client_id     "test-client-id";
            oidc_client_secret "test-client-secret";
            oidc_redirect_uri  "http://localhost:8080/csjwt/callback";
            oidc_client_auth   client_secret_jwt;

            proxy_pass http://127.0.0.1:8081;
            proxy_set_header X-User-Sub    $oidc_claim_sub;
            proxy_set_header X-User-Email  $oidc_claim_email;
            proxy_set_header X-User-Name   $oidc_claim_name;
            proxy_set_header X-User-Groups $oidc_claim_groups;
            proxy_set_header X-Tenant-Id   $oidc_claim_tenant_id;
            proxy_set_header X-Token-Auth  $oidc_claim_token_auth;
            proxy_set_header X-Id-Token    $oidc_id_token;
            proxy_set_header X-Oidc-Sid    $oidc_sid;
        }

        # oidc_provider ブロックを参照するロケーション
        location /preset/ {
            auth_oidc test-idp;

            proxy_pass http://127.0.0.1:8081;
            proxy_set_header X-User-Sub    $oidc_claim_sub;
            proxy_set_header X-User-Email  $oidc_claim_email;
            proxy_set_header X-User-Name   $oidc_claim_name;
            proxy_set_header X-User-Groups $oidc_claim_groups;
            proxy_set_header X-Tenant-Id   $oidc_claim_tenant_id;
            proxy_set_header X-Token-Auth  $oidc_claim_token_auth;
            proxy_set_header X-Id-Token    $oidc_id_token;
            proxy_set_header X-Oidc-Sid    $oidc_sid;
        }

        # Pushed Authorization Requests
        location /par/ {
            auth_oidc          on;
            oidc_provider      "http://127.0.0.1:3000";
            oidc_client_id     "test-client-id";
            oidc_client_secret "test-client-secret";
            oidc_redirect_uri  "http://localhost:8080/par/callback";
            oidc_scope         "openid profile email";
            oidc_par           on;

            proxy_pass http://127.0.0.1:8081;
            proxy_set_header X-User-Sub    $oidc_claim_sub;
            proxy_set_header X-User-Email  $oidc_claim_email;
            proxy_set_header X-User-Name   $oidc_claim_name;
            proxy_set_header X-User-Groups $oidc_claim_groups;
            proxy_set_header X-Tenant-Id   $oidc_claim_tenant_id;
            proxy_set_header X-Token-Auth  $oidc_claim_token_auth;
            proxy_set_header X-Id-Token    $oidc_id_token;
            proxy_set_header X-Oidc-Sid    $oidc_sid;
        }

        # DPoP でトークンを鍵に紐付ける
        location /dpop/ {
            auth_oidc          on;
            oidc_provider      "http://127.0.0.1:3000";
            oidc_client_id     "test-client-id";
            oidc_client_secret "test-client-secret";
            oidc_redirect_uri  "http://localhost:8080/dpop/callback";
            oidc_scope         "openid profile email";
            oidc_use_userinfo  on;
            oidc_dpop          on;
            oidc_dpop_key      dpop-key.pem;

            proxy_pass http://127.0.0.1:8081;
            proxy_set_header X-User-Sub    $oidc_claim_sub;
            proxy_set_header X-User-Email  $oidc_claim_email;
            proxy_set_header X-User-Name   $oidc_claim_name;
            proxy_set_header X-User-Groups $oidc_claim_groups;
            proxy_set_header X-Tenant-Id   $oidc_claim_tenant_id;
            proxy_set_header X-Token-Auth  $oidc_claim_token_auth;
            proxy_set_header X-Id-Token    $oidc_id_token;
            proxy_set_header X-Oidc-Sid    $oidc_sid;
            proxy_set_header X-Token-Type  $oidc_token_type;
            proxy_set_header X-Dpop-Proof  $oidc_dpop_backend_proof;
        }

        # mTLS クライアント認証（HTTPS の IdP に client 証明書を提示する）
        location /mtls/ {
            auth_oidc          on;
            oidc_provider      "https://127.0.0.1:3002";
            oidc_client_id     "test-client-id";
            oidc_redirect_uri  "http://localhost:8080/mtls/callback";
            oidc_scope         "openid profile email";
            oidc_client_auth   mtls;

            proxy_pass http://127.0.0.1:8081;
            proxy_set_header X-User-Sub    $oidc_claim_sub;
            proxy_set_header X-User-Email  $oidc_claim_email;
            proxy_set_header X-User-Name   $oidc_claim_name;
            proxy_set_header X-User-Groups $oidc_claim_groups;
            proxy_set_header X-Tenant-Id   $oidc_claim_tenant_id;
            proxy_set_header X-Token-Auth  $oidc_claim_token_auth;
            proxy_set_header X-Id-Token    $oidc_id_token;
            proxy_set_header X-Oidc-Sid    $oidc_sid;
        }

        # ログアウト後の戻り先（認証不要）
        location = /bye {
            auth_oidc off;
            default_type text/plain;
            return 200 "bye";
        }

        # セッション有効期限の検証用（1 秒で失効する）
        location /short-session/ {
            auth_oidc            on;
            oidc_provider        "http://127.0.0.1:3000";
            oidc_client_id       "test-client-id";
            oidc_client_secret   "test-client-secret";
            oidc_redirect_uri    "http://localhost:8080/callback";
            oidc_scope           "openid profile email";
            oidc_session_timeout 1s;

            proxy_pass http://127.0.0.1:8081;
            proxy_set_header X-User-Sub    $oidc_claim_sub;
            proxy_set_header X-User-Email  $oidc_claim_email;
            proxy_set_header X-User-Name   $oidc_claim_name;
            proxy_set_header X-User-Groups $oidc_claim_groups;
            proxy_set_header X-Tenant-Id   $oidc_claim_tenant_id;
            proxy_set_header X-Token-Auth  $oidc_claim_token_auth;
            proxy_set_header X-Id-Token    $oidc_id_token;
            proxy_set_header X-Oidc-Sid    $oidc_sid;
        }

        # 別プロバイダを使うロケーション（ロケーションごとにメタデータを持つことの検証）
        location /tenant-b/ {
            auth_oidc          on;
            oidc_provider      "http://127.0.0.1:3001";
            oidc_client_id     "tenant-b-client";
            oidc_client_secret "tenant-b-secret";
            oidc_redirect_uri  "http://localhost:8080/tenant-b/callback";
            oidc_scope         "openid profile email";
            oidc_claims        groups;

            proxy_pass http://127.0.0.1:8081;
            proxy_set_header X-User-Sub    $oidc_claim_sub;
            proxy_set_header X-User-Email  $oidc_claim_email;
            proxy_set_header X-User-Name   $oidc_claim_name;
            proxy_set_header X-User-Groups $oidc_claim_groups;
            proxy_set_header X-Tenant-Id   $oidc_claim_tenant_id;
            proxy_set_header X-Token-Auth  $oidc_claim_token_auth;
            proxy_set_header X-Id-Token    $oidc_id_token;
            proxy_set_header X-Oidc-Sid    $oidc_sid;
        }

        location / {
            auth_oidc            on;
            oidc_provider        "http://127.0.0.1:3000";
            oidc_client_id       "test-client-id";
            oidc_client_secret   "test-client-secret";
            oidc_redirect_uri    "http://localhost:8080/callback";
            oidc_scope           "openid profile email";
            oidc_use_userinfo    on;
            oidc_session_timeout 1h;

            proxy_pass http://127.0.0.1:8081;
            proxy_set_header X-User-Sub    $oidc_claim_sub;
            proxy_set_header X-User-Email  $oidc_claim_email;
            proxy_set_header X-User-Name   $oidc_claim_name;
            proxy_set_header X-User-Groups $oidc_claim_groups;
            proxy_set_header X-Tenant-Id   $oidc_claim_tenant_id;
            proxy_set_header X-Token-Auth  $oidc_claim_token_auth;
            proxy_set_header X-Id-Token    $oidc_id_token;
            proxy_set_header X-Oidc-Sid    $oidc_sid;
        }
    }

    # クレームをそのまま JSON で返すだけのバックエンド。
    server {
        listen       8081;
        server_name  backend;

        location / {
            default_type application/json;
            return 200 '{"sub":"$http_x_user_sub","email":"$http_x_user_email","name":"$http_x_user_name","groups":"$http_x_user_groups","tenant_id":"$http_x_tenant_id","token_auth":"$http_x_token_auth","id_token":"$http_x_id_token","sid":"$http_x_oidc_sid","token_type":"$http_x_token_type","dpop_proof":"$http_x_dpop_proof"}';
        }
    }
}
